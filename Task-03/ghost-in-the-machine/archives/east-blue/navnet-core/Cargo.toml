[package]
name = "navnet-core"
version = "0.9.4"
edition = "2021"
description = "Core compatibility and registry library for Navigation Network station deployments."
authors = ["Navigation Network Engineering Division <infra@navnet.local>"]
license = "Apache-2.0"
repository = "https://internal.navnet.local/repos/navnet-core"
readme = "README.md"

[dependencies]
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"

[dev-dependencies]
